<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendly</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2196F3">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --primary:#2196F3;
  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#758096;
  --line:#e1e6ee;
  --green:#20a968;
  --red:#e94b4b;
  --orange:#f59e0b;
  --purple:#805ad5;
  --shadow:0 8px 25px rgba(0,0,0,.08);
}

body.dark{
  --bg:#10131a;
  --card:#181d27;
  --text:#f4f6fa;
  --muted:#9ba6b8;
  --line:#2b3342;
  --shadow:0 8px 25px rgba(0,0,0,.3);
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* TOP BAR */

.topbar{
  height:64px;
  background:var(--card);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  padding:0 15px;
  gap:14px;
  position:sticky;
  top:0;
  z-index:100;
}

.menu-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:10px;
  background:var(--bg);
  color:var(--text);
  font-size:24px;
  cursor:pointer;
}

.logo{
  font-size:21px;
  font-weight:800;
  color:var(--primary);
}

/* SIDEBAR */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:190;
  opacity:0;
  visibility:hidden;
  transition:.25s;
}

.overlay.show{
  opacity:1;
  visibility:visible;
}

.sidebar{
  position:fixed;
  top:0;
  left:0;
  width:300px;
  max-width:85vw;
  height:100vh;
  background:var(--card);
  z-index:200;
  padding:20px;
  overflow-y:auto;
  transform:translateX(-100%);
  transition:transform .25s ease;
  box-shadow:8px 0 30px rgba(0,0,0,.2);
}

.sidebar.open{
  transform:translateX(0);
}

.side-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.side-title{
  font-size:23px;
  font-weight:800;
}

.close-btn{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:var(--bg);
  color:var(--text);
  font-size:24px;
  cursor:pointer;
}

/* PROFILE */

.profile-box{
  padding:15px;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:15px;
}

.profile-top{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:15px;
}

.profile-container{
  width:65px;
  height:65px;
  flex-shrink:0;
}

.profile-picture{
  width:65px;
  height:65px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--primary);
}

.profile-placeholder{
  width:65px;
  height:65px;
  border-radius:50%;
  background:var(--primary);
  color:white;
  display:grid;
  place-items:center;
  font-size:28px;
}

.photo-buttons{
  display:flex;
  flex-direction:column;
  gap:6px;
  flex:1;
}

.photo-btn{
  width:100%;
  border:0;
  border-radius:8px;
  padding:8px;
  background:var(--primary);
  color:white;
  font-weight:700;
  cursor:pointer;
}

.remove-btn{
  background:#ffe8e8;
  color:#d52f2f;
}

.profile-label{
  font-size:11px;
  font-weight:800;
  color:var(--muted);
  margin-bottom:6px;
}

.name-input{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--card);
  color:var(--text);
  outline:none;
  font-size:15px;
}

.save-profile{
  width:100%;
  margin-top:12px;
  border:0;
  border-radius:10px;
  padding:12px;
  background:var(--green);
  color:white;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
}

.saved-message{
  text-align:center;
  font-size:12px;
  color:var(--green);
  font-weight:700;
  margin-top:8px;
  display:none;
}

/* DARK MODE */

.theme-toggle{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--card);
  color:var(--text);
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
  font-weight:700;
}

.theme-left{
  display:flex;
  align-items:center;
  gap:9px;
}

.toggle{
  width:43px;
  height:24px;
  background:#cfd5df;
  border-radius:20px;
  padding:3px;
}

.toggle-circle{
  width:18px;
  height:18px;
  background:white;
  border-radius:50%;
  transition:.2s;
}

body.dark .toggle{
  background:var(--primary);
}

body.dark .toggle-circle{
  transform:translateX(19px);
}

/* SIDEBAR STATS */

.stat-card{
  margin-top:15px;
  padding:15px;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:14px;
}

.stat-title{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

.stat-value{
  font-size:24px;
  font-weight:800;
  margin-top:5px;
}

/* MAIN */

.main{
  max-width:900px;
  margin:auto;
  padding:18px;
}

.welcome{
  margin-bottom:18px;
}

.welcome h1{
  margin:0;
  font-size:25px;
}

.welcome p{
  margin:5px 0 0;
  color:var(--muted);
}

/* DASHBOARD */

.dashboard{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:18px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  padding:15px;
  box-shadow:var(--shadow);
}

.card-title{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

.card-number{
  font-size:25px;
  font-weight:800;
  margin-top:7px;
}

/* CALENDAR */

.calendar-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  box-shadow:var(--shadow);
}

.calendar-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.month-title{
  font-size:20px;
  font-weight:800;
}

.nav-buttons{
  display:flex;
  gap:7px;
}

.nav-buttons button{
  width:38px;
  height:38px;
  border:0;
  border-radius:9px;
  background:var(--bg);
  color:var(--text);
  font-size:18px;
  cursor:pointer;
}

.weekdays,
.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.weekdays div{
  text-align:center;
  font-size:11px;
  color:var(--muted);
  font-weight:800;
  padding-bottom:7px;
}

.day{
  min-height:48px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--card);
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.day-number{
  font-size:13px;
  font-weight:800;
}

.day-status{
  font-size:9px;
  margin-top:3px;
  font-weight:800;
}

.present{
  background:#e8f8f0;
  border-color:#8edbb6;
  color:#13834c;
}

.half{
  background:#fff5df;
  border-color:#ffd37b;
  color:#b66b00;
}

.absent{
  background:#ffeaea;
  border-color:#ffaaaa;
  color:#cf3030;
}

.leave{
  background:#eee9ff;
  border-color:#c3b5ff;
  color:#6a49d7;
}

body.dark .present{
  background:#123a29;
  border-color:#246d4d;
}

body.dark .half{
  background:#3d2e13;
  border-color:#76571f;
}

body.dark .absent{
  background:#3b1818;
  border-color:#703333;
}

body.dark .leave{
  background:#292044;
  border-color:#51418a;
}

/* LEGEND */

.legend{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:17px;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:5px;
  font-size:12px;
  color:var(--muted);
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
}

.dot.present{background:var(--green);}
.dot.half{background:var(--orange);}
.dot.absent{background:var(--red);}
.dot.leave{background:var(--purple);}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:400px;
  background:var(--card);
  color:var(--text);
  border-radius:18px;
  padding:20px;
}

.modal-box h2{
  margin-top:0;
}

.status-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin:15px 0;
}

.status-buttons button{
  padding:13px 5px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--text);
  font-weight:700;
  cursor:pointer;
}

.status-buttons button.selected{
  border:2px solid var(--primary);
}

.remark{
  width:100%;
  min-height:80px;
  resize:none;
  padding:11px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--text);
  outline:none;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.modal-actions button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
}

.cancel{
  background:var(--bg);
  color:var(--text);
}

.save{
  background:var(--primary);
  color:white;
}

/* MOBILE */

@media(max-width:600px){

  .dashboard{
    grid-template-columns:1fr 1fr;
  }

  .dashboard .card:last-child{
    grid-column:span 2;
  }

  .main{
    padding:13px;
  }

  .day{
    min-height:44px;
  }
}
</style>
</head>

<body>

<!-- SIDEBAR OVERLAY -->
<div id="overlay" class="overlay"></div>

<!-- SIDEBAR -->
<aside id="sidebar" class="sidebar">

  <div class="side-header">

    <div class="side-title">
      Attendly
    </div>

    <button id="closeButton" class="close-btn">
      ×
    </button>

  </div>


  <!-- PROFILE -->

  <div class="profile-box">

    <div class="profile-top">

      <div id="profileContainer" class="profile-container">
        <div class="profile-placeholder">👤</div>
      </div>

      <div class="photo-buttons">

        <button id="photoButton" class="photo-btn">
          🖼️ Choose Photo
        </button>

        <button id="removePhotoButton" class="photo-btn remove-btn">
          Remove
        </button>

      </div>

    </div>


    <input
      type="file"
      id="photoInput"
      accept="image/*"
      style="display:none"
    >


    <div class="profile-label">
      YOUR NAME
    </div>


    <input
      id="nameInput"
      class="name-input"
      type="text"
      placeholder="Enter your name"
    >


    <button id="saveProfileButton" class="save-profile">
      💾 Save Profile
    </button>


    <div id="savedMessage" class="saved-message">
      ✓ Profile saved
    </div>

  </div>


  <!-- DARK MODE -->

  <button id="themeButton" class="theme-toggle">

    <div class="theme-left">

      <span id="themeIcon">🌙</span>

      <span id="themeText">
        Dark Mode
      </span>

    </div>

    <div class="toggle">

      <div class="toggle-circle"></div>

    </div>

  </button>


  <!-- STATS -->

  <div class="stat-card">

    <div class="stat-title">
      TOTAL MONTHS
    </div>

    <div id="sideMonths" class="stat-value">
      0
    </div>

  </div>


  <div class="stat-card">

    <div class="stat-title">
      OVERALL ATTENDANCE
    </div>

    <div id="sideAttendance" class="stat-value">
      0%
    </div>

  </div>


  <div class="stat-card">

    <div class="stat-title">
      TOTAL MARKED DAYS
    </div>

    <div id="sideMarked" class="stat-value">
      0
    </div>

  </div>

</aside>


<!-- TOP BAR -->

<header class="topbar">

  <button id="menuButton" class="menu-btn">
    ☰
  </button>

  <div class="logo">
    Attendly
  </div>

</header>


<!-- MAIN -->

<main class="main">

  <div class="welcome">

    <h1 id="welcomeText">
      Attendance Calendar
    </h1>

    <p>
      Track your attendance easily.
    </p>

  </div>


  <!-- DASHBOARD -->

  <section class="dashboard">

    <div class="card">

      <div class="card-title">
        PRESENT
      </div>

      <div id="presentCount" class="card-number">
        0
      </div>

    </div>


    <div class="card">

      <div class="card-title">
        HALF DAY
      </div>

      <div id="halfCount" class="card-number">
        0
      </div>

    </div>


    <div class="card">

      <div class="card-title">
        ABSENT
      </div>

      <div id="absentCount" class="card-number">
        0
      </div>

    </div>

  </section>


  <!-- CALENDAR -->

  <section class="calendar-card">

    <div class="calendar-header">

      <div id="monthTitle" class="month-title">
      </div>

      <div class="nav-buttons">

        <button id="previousButton">
          ‹
        </button>

        <button id="todayButton">
          ●
        </button>

        <button id="nextButton">
          ›
        </button>

      </div>

    </div>


    <div class="weekdays">

      <div>Sun</div>
      <div>Mon</div>
      <div>Tue</div>
      <div>Wed</div>
      <div>Thu</div>
      <div>Fri</div>
      <div>Sat</div>

    </div>


    <div id="days" class="days">
    </div>


    <div class="legend">

      <div class="legend-item">
        <span class="dot present"></span>
        Present
      </div>

      <div class="legend-item">
        <span class="dot half"></span>
        Half Day
      </div>

      <div class="legend-item">
        <span class="dot absent"></span>
        Absent
      </div>

      <div class="legend-item">
        <span class="dot leave"></span>
        Leave
      </div>

    </div>

  </section>

</main>


<!-- ATTENDANCE MODAL -->

<div id="modal" class="modal">

  <div class="modal-box">

    <h2 id="modalDate">
      Attendance
    </h2>


    <div class="status-buttons">

      <button id="btn-present">
        ✓ Present
      </button>

      <button id="btn-half">
        ½ Half Day
      </button>

      <button id="btn-absent">
        ✕ Absent
      </button>

      <button id="btn-leave">
        ★ Leave
      </button>

    </div>


    <textarea
      id="remark"
      class="remark"
      placeholder="Add a remark..."
    ></textarea>


    <div class="modal-actions">

      <button id="cancelButton" class="cancel">
        Cancel
      </button>

      <button id="saveButton" class="save">
        Save
      </button>

    </div>

  </div>

</div>


<script>

/* =========================
   DATA
========================= */

let attendance = {};

try{
  attendance =
    JSON.parse(
      localStorage.getItem("attendly") || "{}"
    );
}catch(error){
  attendance = {};
}

let selectedDate = "";
let selectedStatus = "";
let currentDate = new Date();


/* =========================
   SIDEBAR
========================= */

const sidebar =
  document.getElementById("sidebar");

const overlay =
  document.getElementById("overlay");

const menuButton =
  document.getElementById("menuButton");

const closeButton =
  document.getElementById("closeButton");


function openSidebar(){

  sidebar.classList.add("open");

  overlay.classList.add("show");

}


function closeSidebar(){

  sidebar.classList.remove("open");

  overlay.classList.remove("show");

}


/* IMPORTANT:
   Sidebar buttons use addEventListener
   instead of inline onclick. */

menuButton.addEventListener(
  "click",
  openSidebar
);

closeButton.addEventListener(
  "click",
  closeSidebar
);

overlay.addEventListener(
  "click",
  closeSidebar
);


/* =========================
   PROFILE
========================= */

let selectedPhoto =
  localStorage.getItem("attendly-photo") || "";


const profileContainer =
  document.getElementById("profileContainer");

const photoInput =
  document.getElementById("photoInput");

const nameInput =
  document.getElementById("nameInput");


function displayPhoto(){

  if(selectedPhoto){

    profileContainer.innerHTML =
      '<img class="profile-picture" src="' +
      selectedPhoto +
      '" alt="Profile">';

  }else{

    profileContainer.innerHTML =
      '<div class="profile-placeholder">👤</div>';

  }

}


document
  .getElementById("photoButton")
  .addEventListener("click",function(){

    photoInput.click();

  });


photoInput.addEventListener(
  "change",
  function(){

    const file =
      photoInput.files[0];

    if(!file) return;

    const reader =
      new FileReader();

    reader.onload = function(event){

      selectedPhoto =
        event.target.result;

      displayPhoto();

    };

    reader.readAsDataURL(file);

  }
);


document
  .getElementById("removePhotoButton")
  .addEventListener("click",function(){

    selectedPhoto = "";

    localStorage.removeItem(
      "attendly-photo"
    );

    photoInput.value = "";

    displayPhoto();

  });


document
  .getElementById("saveProfileButton")
  .addEventListener("click",function(){

    const name =
      nameInput.value.trim();

    localStorage.setItem(
      "attendly-name",
      name
    );

    if(selectedPhoto){

      localStorage.setItem(
        "attendly-photo",
        selectedPhoto
      );

    }

    updateWelcome();

    const message =
      document.getElementById("savedMessage");

    message.style.display = "block";

    setTimeout(function(){

      message.style.display = "none";

    },2000);

  });


function updateWelcome(){

  const name =
    localStorage.getItem(
      "attendly-name"
    ) || "";

  if(name){

    document
      .getElementById("welcomeText")
      .textContent =
        "Hello, " + name + " 👋";

  }else{

    document
      .getElementById("welcomeText")
      .textContent =
        "Attendance Calendar";

  }

}


function loadProfile(){

  nameInput.value =
    localStorage.getItem(
      "attendly-name"
    ) || "";

  selectedPhoto =
    localStorage.getItem(
      "attendly-photo"
    ) || "";

  displayPhoto();

  updateWelcome();

}


/* =========================
   DARK MODE
========================= */

let darkMode =
  localStorage.getItem(
    "attendly-dark"
  ) === "true";


function applyDarkMode(){

  document.body.classList.toggle(
    "dark",
    darkMode
  );

  if(darkMode){

    document
      .getElementById("themeIcon")
      .textContent = "☀️";

    document
      .getElementById("themeText")
      .textContent = "Light Mode";

  }else{

    document
      .getElementById("themeIcon")
      .textContent = "🌙";

    document
      .getElementById("themeText")
      .textContent = "Dark Mode";

  }

}


document
  .getElementById("themeButton")
  .addEventListener(
    "click",
    function(){

      darkMode = !darkMode;

      localStorage.setItem(
        "attendly-dark",
        darkMode
      );

      applyDarkMode();

    }
  );


/* =========================
   CALENDAR
========================= */

function renderCalendar(){

  const year =
    currentDate.getFullYear();

  const month =
    currentDate.getMonth();


  const monthNames = [
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December"
  ];


  document
    .getElementById("monthTitle")
    .textContent =
      monthNames[month] +
      " " +
      year;


  const days =
    document.getElementById("days");

  days.innerHTML = "";


  const firstDay =
    new Date(
      year,
      month,
      1
    ).getDay();


  const totalDays =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  for(let i=0;i<firstDay;i++){

    const empty =
      document.createElement("div");

    days.appendChild(empty);

  }


  for(let day=1;day<=totalDays;day++){

    const dateKey =
      year +
      "-" +
      String(month + 1).padStart(2,"0") +
      "-" +
      String(day).padStart(2,"0");


    const data =
      attendance[dateKey];


    const element =
      document.createElement("div");

    element.className = "day";


    if(data && data.status){

      element.classList.add(
        data.status
      );

    }


    let statusText = "";


    if(data){

      if(data.status === "present")
        statusText = "Present";

      if(data.status === "half")
        statusText = "Half";

      if(data.status === "absent")
        statusText = "Absent";

      if(data.status === "leave")
        statusText = "Leave";

    }


    element.innerHTML =
      '<div class="day-number">' +
      day +
      '</div>' +
      '<div class="day-status">' +
      statusText +
      '</div>';


    element.addEventListener(
      "click",
      function(){

        openAttendance(dateKey);

      }
    );


    days.appendChild(element);

  }


  updateStats();

}


/* =========================
   ATTENDANCE MODAL
========================= */


function openAttendance(dateKey){

  selectedDate = dateKey;

  const data = attendance[dateKey];

  selectedStatus = data ? data.status : "";

  document.getElementById("remark").value =
    data ? (data.remark || "") : "";

  document.getElementById("modalDate").textContent =
    dateKey;

  updateSelectedButtons();

  document.getElementById("modal").classList.add("show");
}


function closeModal(){

  document.getElementById("modal").classList.remove("show");

}


document.getElementById("cancelButton").addEventListener(
  "click",
  closeModal
);


function selectStatus(status){

  selectedStatus = status;

  updateSelectedButtons();

}


function updateSelectedButtons(){

  ["present","half","absent","leave"].forEach(function(status){

    document
      .getElementById("btn-" + status)
      .classList.toggle(
        "selected",
        selectedStatus === status
      );

  });

}


document.getElementById("btn-present").addEventListener(
  "click",
  function(){
    selectStatus("present");
  }
);


document.getElementById("btn-half").addEventListener(
  "click",
  function(){
    selectStatus("half");
  }
);


document.getElementById("btn-absent").addEventListener(
  "click",
  function(){
    selectStatus("absent");
  }
);


document.getElementById("btn-leave").addEventListener(
  "click",
  function(){
    selectStatus("leave");
  }
);


document.getElementById("saveButton").addEventListener(
  "click",
  function(){

    if(!selectedStatus){

      delete attendance[selectedDate];

    }else{

      attendance[selectedDate] = {
        status: selectedStatus,
        remark: document.getElementById("remark").value.trim()
      };

    }

    localStorage.setItem(
      "attendly",
      JSON.stringify(attendance)
    );

    closeModal();

    renderCalendar();

  }
);


/* MONTH BUTTONS */

document.getElementById("previousButton").addEventListener(
  "click",
  function(){

    currentDate.setMonth(
      currentDate.getMonth() - 1
    );

    renderCalendar();

  }
);


document.getElementById("nextButton").addEventListener(
  "click",
  function(){

    currentDate.setMonth(
      currentDate.getMonth() + 1
    );

    renderCalendar();

  }
);


document.getElementById("todayButton").addEventListener(
  "click",
  function(){

    currentDate = new Date();

    renderCalendar();

  }
);


/* STATISTICS */

function updateStats(){

  let present = 0;
  let half = 0;
  let absent = 0;
  let marked = 0;

  Object.keys(attendance).forEach(function(date){

    const data = attendance[date];

    if(!data) return;

    if(data.status === "present"){
      present++;
      marked++;
    }

    if(data.status === "half"){
      half++;
      marked++;
    }

    if(data.status === "absent"){
      absent++;
      marked++;
    }

    if(data.status === "leave"){
      marked++;
    }

  });


  const total = present + half + absent;

  const percentage =
    total > 0
      ? ((present + half * 0.5) / total * 100).toFixed(1)
      : 0;


  document.getElementById("presentCount").textContent =
    present;

  document.getElementById("halfCount").textContent =
    half;

  document.getElementById("absentCount").textContent =
    absent;

  document.getElementById("sideMarked").textContent =
    marked;

  document.getElementById("sideAttendance").textContent =
    percentage + "%";


  const months = new Set();

  Object.keys(attendance).forEach(function(date){

    months.add(date.substring(0,7));

  });

  document.getElementById("sideMonths").textContent =
    months.size;

}

      });
