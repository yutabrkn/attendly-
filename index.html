<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2196F3">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendly — Attendance Calendar</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#748096;--line:#e7ebf2;--primary:#5b5ce2;--green:#20a464;--red:#e05252;--yellow:#e0a72f;--shadow:0 12px 35px rgba(30,40,80,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
.app{max-width:1050px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:14px;background:var(--primary);color:white;display:grid;place-items:center;font-size:23px;font-weight:800}.brand h1{font-size:21px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.monthbar h2{margin:0;font-size:19px}.arrows{display:flex;gap:7px}.iconbtn{width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;font-size:18px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week div{text-align:center;color:var(--muted);font-size:11px;font-weight:700;padding:7px 0}.day{min-height:76px;border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;position:relative;background:#fff}.day:hover{border-color:#bfc2f5}.day.muted{opacity:.3}.num{font-size:12px;font-weight:700}.status{margin-top:12px;font-size:11px;font-weight:800}.present{background:#effaf4;border-color:#bfe8d0}.present .status{color:var(--green)}.absent{background:#fff3f3;border-color:#f0c4c4}.absent .status{color:var(--red)}.leave{background:#fff9e9;border-color:#f0dfad}.leave .status{color:#b98212}.today{outline:2px solid #8586ed;outline-offset:-2px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:14px;border-radius:14px;background:#f7f8fc}.stat b{display:block;font-size:22px;margin-top:3px}.stat span{font-size:12px;color:var(--muted)}.percent{display:grid;place-items:center;margin:18px auto;width:145px;height:145px;border-radius:50%;background:conic-gradient(var(--primary) var(--pct),#e9ebf4 0);position:relative}.percent:after{content:"";position:absolute;width:105px;height:105px;border-radius:50%;background:#fff}.percent strong{position:relative;z-index:1;font-size:25px}.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:15px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.remark{margin-top:18px}.remark h3{font-size:14px;margin:0 0 8px}.remarkbox{min-height:75px;padding:12px;background:#f8f9fc;border:1px solid var(--line);border-radius:12px;color:#657087;font-size:13px}.modal{display:none;position:fixed;inset:0;background:rgba(15,20,40,.45);align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.dialog{background:#fff;border-radius:18px;width:min(430px,100%);padding:20px}.dialog h2{margin:0 0 5px}.dialog small{color:var(--muted)}label{display:block;font-size:12px;font-weight:800;margin:18px 0 7px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice{padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-weight:700;font-size:12px}.choice.active{background:#eeeeff;border-color:#7778e8;color:#4d4ed2}textarea{width:100%;min-height:90px;resize:vertical;border:1px solid var(--line);border-radius:11px;padding:11px;font:inherit;outline:none}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.secondary{background:#f0f1f5;color:#333}.empty{grid-column:span 7;height:10px}
@media(max-width:760px){.app{padding:12px}.grid{grid-template-columns:1fr}.day{min-height:65px}.status{font-size:9px}.top .btn{display:none}.card{padding:13px}.stats{grid-template-columns:repeat(4,1fr)}.stat{padding:10px}.stat b{font-size:18px}.stat span{font-size:10px}.percent{width:120px;height:120px}.percent:after{width:88px;height:88px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><div class="logo">✓</div><div><h1>Attendly</h1><p>Attendance & remarks calendar</p></div></div>
  <button class="btn" onclick="markToday()">＋ Mark Today</button>
</header>
<div class="grid">
<section class="card">
  <div class="monthbar"><h2 id="month"></h2><div class="arrows"><button class="iconbtn" onclick="moveMonth(-1)">‹</button><button class="iconbtn" onclick="moveMonth(1)">›</button></div></div>
  <div class="week"><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div><div>SUN</div></div>
  <div class="days" id="days"></div>
  <div class="legend"><span><i class="dot" style="background:var(--green)"></i>Present</span><span><i class="dot" style="background:var(--red)"></i>Absent</span><span><i class="dot" style="background:var(--yellow)"></i>Leave</span></div>
</section>
<aside class="card">
  <h3 style="margin:0 0 12px">This month</h3>
  <div class="percent" id="ring" style="--pct:0%"><strong id="pct">0%</strong></div>
  <div class="stats">
    <div class="stat"><span>Present</span><b id="present">0</b></div>
    <div class="stat"><span>Absent</span><b id="absent">0</b></div>
    <div class="stat"><span>Leave</span><b id="leave">0</b></div>
    <div class="stat"><span>Marked</span><b id="marked">0</b></div>
  </div>
  <div class="remark"><h3>Selected date</h3><div class="remarkbox" id="selectedRemark">Tap a date to add attendance and a remark.</div></div>
</aside>
</div>
</div>

<div class="modal" id="modal">
 <div class="dialog">
  <h2 id="dialogDate"></h2><small>Update attendance for this date</small>
  <label>Status</label>
  <div class="choices">
   <button class="choice" data-status="present" onclick="choose('present')">✓ Present</button>
   <button class="choice" data-status="absent" onclick="choose('absent')">✕ Absent</button>
   <button class="choice" data-status="leave" onclick="choose('leave')">• Leave</button>
  </div>
  <label>Remark</label><textarea id="remarkInput" placeholder="e.g. Sick, attended class, festival holiday..."></textarea>
  <div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="save()">Save</button></div>
 </div>
</div>
<script>
let view=new Date(); let selected=null; let chosen='';
const key=d=>d.toISOString().slice(0,10);
let data=JSON.parse(localStorage.getItem('attendly')||'{}');
function render(){
 const y=view.getFullYear(),m=view.getMonth(); document.getElementById('month').textContent=view.toLocaleString('en',{month:'long',year:'numeric'});
 const days=document.getElementById('days'); days.innerHTML='';
 const first=(new Date(y,m,1).getDay()+6)%7, total=new Date(y,m+1,0).getDate();
 for(let i=0;i<first;i++) days.innerHTML+='<div class="empty"></div>';
 const today=key(new Date());
 for(let n=1;n<=total;n++){
  const d=new Date(y,m,n), k=key(d), rec=data[k]||{}, el=document.createElement('div');
  el.className='day '+(rec.status||'')+(k===today?' today':'');
  el.innerHTML=`<div class="num">${n}</div>${rec.status?`<div class="status">${rec.status[0].toUpperCase()+rec.status.slice(1)}</div>`:''}`;
  el.onclick=()=>openModal(k); days.appendChild(el);
 }
 stats();
}
function stats(){
 const y=view.getFullYear(),m=view.getMonth(), prefix=`${y}-${String(m+1).padStart(2,'0')}`;
 let p=0,a=0,l=0; Object.entries(data).forEach(([k,v])=>{if(k.startsWith(prefix)){if(v.status==='present')p++;if(v.status==='absent')a++;if(v.status==='leave')l++;}});
 const marked=p+a+l, pct=marked?Math.round(p/marked*100):0;
 present.textContent=p;absent.textContent=a;leave.textContent=l;markedEl.textContent=marked;
 document.getElementById('pct').textContent=pct+'%';document.getElementById('ring').style.setProperty('--pct',pct+'%');
}
const markedEl=document.getElementById('marked');
function moveMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);render()}
function openModal(k){
 selected=k; const d=new Date(k+'T00:00:00'); document.getElementById('dialogDate').textContent=d.toLocaleDateString('en',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 const rec=data[k]||{}; chosen=rec.status||'';document.getElementById('remarkInput').value=rec.remark||'';updateChoices();document.getElementById('modal').classList.add('show');
 document.getElementById('selectedRemark').textContent=rec.remark||'No remark for this date.';
}
function choose(s){chosen=s;updateChoices()}
function updateChoices(){document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('active',b.dataset.status===chosen))}
function save(){if(!chosen && !document.getElementById('remarkInput').value.trim()) delete data[selected]; else data[selected]={status:chosen,remark:document.getElementById('remarkInput').value.trim()};localStorage.setItem('attendly',JSON.stringify(data));closeModal();render();document.getElementById('selectedRemark').textContent=data[selected]?.remark||'No remark for this date.'}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function markToday(){view=new Date();render();openModal(key(new Date()))}
render();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js");
  });
}
</script>
</body>
</html>
